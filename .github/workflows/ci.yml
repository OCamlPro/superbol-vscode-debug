name: Run VSCode Extension Tests

on:
  push:
    branches:
      - superbol-vscode-debug
  pull_request:
    branches:
      - superbol-vscode-debug

jobs:
  test:
    strategy:
      matrix:
        os:
           - ubuntu-latest
           - macos-latest
           - windows-latest
        node:
           - 20
        include:
           - { os: ubuntu-latest, node: 22 }
           - { os: ubuntu-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    name: Test with Node ${{ matrix.node }} on ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
           node-version: ${{ matrix.node }}
           # node-version-file: 'package.json'

      - name: Cache VSCode test directory
        uses: actions/cache@v4
        with:
           path: .vscode-test
           key: ${{ runner.os }}-${{ matrix.node }}-vscode-test-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: xvfb-run -a npm test
        if: runner.os == 'Linux'

      - name: Run tests
        run: npm test
        if: runner.os != 'Linux'
